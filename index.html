<!DOCTYPE html>
<html>
<head>
    <title>38TH MILLENNIAL MEET</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        input[type="text"], select {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    box-sizing: border-box;
}

input[type="radio"] {
    width: auto;
    margin-right: 5px;
}
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<h1>38TH MILLENNIAL<br>MEET</h1>

<p><strong>DATE:</strong> 01 November 2026</p>

<p>
<strong>VENUE:</strong> Your Venue Name<br>
Your Location
</p>

<hr>

<h2>REGISTRATION</h2>

<label>NAME</label><br>
<input type="text" id="name" placeholder="Your full name">

<br><br>

<label>USER NAME</label><br>
<input type="text" id="username" placeholder="Your unique user name">

<br><br>

<label>BASE CLUB</label><br>
<select id="baseclub">
    <option value="">Select your base club</option>
    <option>Millenial</option>
    <option>Genx</option>
    <option>Lambo</option>
    <option>Mooning</option>
     <option>Oberon</option>
     <option>Titan</option>
</select>

<br><br>

<label>ARE YOU WILLING TO ATTEND THE MEETING?</label>
<br>
<input type="radio" name="attend" value="Yes"> Yes
<input type="radio" name="attend" value="No"> No

<br><br>

<label>NIGHT STAY?</label>
<br>
<input type="radio" name="stay" value="Yes"> Yes
<input type="radio" name="stay" value="No"> No

<br><br>

<button type="button" onclick="registerForm()">
    REGISTER FOR THE MEET
</button>

<script>
function registerForm() {

    let name = document.getElementById("name").value;
    let username = document.getElementById("username").value;
    let baseclub = document.getElementById("baseclub").value;

    let attend = document.querySelector('input[name="attend"]:checked');
    let stay = document.querySelector('input[name="stay"]:checked');

    attend = attend ? attend.value : "Not selected";
    stay = stay ? stay.value : "Not selected";

    const scriptURL = "https://script.google.com/macros/s/AKfycbyKzM8WzgN5PeqhHwuceBo9Lx9tt2iaVmAHTglinZy0eQikodOO6-Vq3Eiv_iwH-W_z7w/exec";

    const formData = new URLSearchParams();

    formData.append("name", name);
    formData.append("username", username);
    formData.append("baseclub", baseclub);
    formData.append("attendance", attend);
    formData.append("nightstay", stay);

    fetch(scriptURL, {
        method: "POST",
        body: formData
    })
    .then(response => response.text())
    .then(result => {
        alert("Registration successful!\n\nThank you " + name + "!");
    })
    .catch(error => {
        alert("Registration failed. Please try again.");
        console.error(error);
    });
}
</script>
